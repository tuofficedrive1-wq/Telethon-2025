<!DOCTYPE html>
<html lang="en">
<head>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telethon Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; } .hidden { display: none !important; }</style>
</head>
<body class="p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Header & Tabs -->
        <header class="mb-6 flex flex-col md:flex-row justify-between items-center bg-indigo-600 text-white p-4 rounded-xl shadow-lg gap-4">
            <div>
                <h1 class="text-2xl font-bold">Telethon 2026 - Admin Panel</h1>
                <p class="text-sm opacity-80">Manage Zimmedars and Asatiza Reports</p>
            </div>
            <!-- Tabs Buttons -->
            <div class="flex gap-2 bg-indigo-800 p-1 rounded-lg">
                <button onclick="switchTab('zimmedarTab')" id="btnZimmedar" class="px-4 py-2 bg-white text-indigo-700 font-bold rounded-md shadow transition">Zimmedar Manage</button>
                <button onclick="switchTab('asatizaTab')" id="btnAsatiza" class="px-4 py-2 text-white font-bold rounded-md hover:bg-indigo-700 transition">Asatiza Detail</button>
            </div>
        </header>

        <!-- ========================================== -->
        <!-- TAB 1: ZIMMEDAR MANAGE -->
        <!-- ========================================== -->
        <div id="zimmedarTab" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Form -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 h-fit">
                <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Naya Zimmedar Add Karein</h2>
                <form id="createUserForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold">Zimmedar Ka Naam</label>
                        <input type="text" id="ustazName" required class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">Jamia Name (Zimmedar Ka)</label>
                        <input type="text" id="jamiaName" required class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold">Assign Class</label>
                        <select id="assignedClass" required class="w-full px-3 py-2 border rounded-lg">
                            <option value="">Class Select Karein...</option>
                            <option value="Hifz Class">Hifz Class</option>
                            <option value="Ibtidaiya">Ibtidaiya</option>
                            <option value="Sale Awwal">Sale Awwal</option>
                            <option value="Sale Duwam">Sale Duwam</option>
                            <option value="Ula">Ula</option>
                            <option value="Saniya">Saniya</option>
                            <option value="Salisa">Salisa</option>
                            <option value="Rabia">Rabia</option>
                            <option value="Khamisa">Khamisa</option>
                            <option value="Sadisa">Sadisa</option>
                            <option value="Sabia">Sabia</option>
                            <option value="Doratul Hadis">Doratul Hadis</option>
                        </select>
                    </div>
                    <div class="pt-2 border-t">
                        <label class="block text-sm font-semibold text-indigo-600">Username (Login ke liye)</label>
                        <input type="text" id="username" required placeholder="Jaise: zaid_ula" class="w-full px-3 py-2 border rounded-lg bg-indigo-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-indigo-600">Password</label>
                        <input type="text" id="password" required placeholder="Kam se kam 6 huroof" class="w-full px-3 py-2 border rounded-lg bg-indigo-50">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700">Account Banayein</button>
                </form>
            </div>

            <!-- Table -->
            <div class="col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h2 class="text-xl font-bold text-slate-800 mb-4 border-b pb-2">Registered Zimmedars</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 text-sm">
                                <th class="p-3 border-b">Username</th>
                                <th class="p-3 border-b">Zimmedar Name</th>
                                <th class="p-3 border-b">Jamia</th>
                                <th class="p-3 border-b">Class</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- TAB 2: ASATIZA REPORT (Naya System)        -->
        <!-- ========================================== -->
        <div id="asatizaTab" class="hidden bg-white p-6 rounded-xl shadow-md border border-slate-200">
            
            <!-- Controls (Search & Export) -->
            <!-- Controls (Search & Export) -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4 border-b pb-4">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    Asatiza Records
                    <span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full">Live Updates</span>
                </h2>
                
                <div class="flex flex-wrap justify-end gap-3 w-full md:w-auto">
                    <!-- Search Input -->
                    <div class="relative w-full sm:w-64">
                        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Jamia, Naam ya Zimmedar..." class="w-full pl-8 pr-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                        <svg class="w-4 h-4 absolute left-2.5 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                   <!-- Download Table Image Button -->
<button onclick="downloadTableAsImage(event)" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg text-sm flex items-center gap-2 transition whitespace-nowrap shadow-sm">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
    <span>Download List Image</span>
</button>
                    <!-- Export Excel Button -->
                    <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg text-sm flex items-center gap-2 transition whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Export Excel
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="asatizaMainTable">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider">
                            <th class="p-3 border-b font-semibold">Photo</th>
                            <th class="p-3 border-b font-semibold">Ustaz Name</th>
                            <th class="p-3 border-b font-semibold">Jamia Name</th>
                            <th class="p-3 border-b font-bold text-indigo-700">Zimmedar</th>
                            <th class="p-3 border-b font-semibold">Region & State</th>
                            <th class="p-3 border-b font-semibold">Mobile No.</th>
                            <th class="p-3 border-b font-semibold">Darja (Class)</th>
                            <th class="p-3 border-b font-semibold">Date</th>
                            <th class="p-3 border-b font-semibold text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="asatizaTableBody" class="text-sm">
                        <tr><td colspan="7" class="p-4 text-center text-slate-500">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Image Modal for Full View -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4" onclick="closeModal()">
        <img id="modalImage" src="" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl" onclick="event.stopPropagation()">
        <button class="absolute top-4 right-4 text-white hover:text-gray-300" onclick="closeModal()">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <script>
        // ========================================================
        // 🛑 APNA FIREBASE CONFIG YAHAN PASTE KAREIN 🛑
        // ========================================================
       const firebaseConfig = {
  apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
  authDomain: "telethon-28c88.firebaseapp.com",
  projectId: "telethon-28c88",
  storageBucket: "telethon-28c88.firebasestorage.app",
  messagingSenderId: "609452116316",
  appId: "1:609452116316:web:e940fc5dc4537b34551999",
  measurementId: "G-FYS0PJLQQB"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const secondaryApp = firebase.initializeApp(firebaseConfig, "SecondaryApp");
        const secondaryAuth = secondaryApp.auth();

        // --- TAB SWITCH LOGIC ---
        function switchTab(tabId) {
            document.getElementById('zimmedarTab').classList.add('hidden');
            document.getElementById('asatizaTab').classList.add('hidden');
            document.getElementById('btnZimmedar').className = "px-4 py-2 text-white font-bold rounded-md hover:bg-indigo-700 transition";
            document.getElementById('btnAsatiza').className = "px-4 py-2 text-white font-bold rounded-md hover:bg-indigo-700 transition";

            document.getElementById(tabId).classList.remove('hidden');
            if(tabId === 'zimmedarTab') {
                document.getElementById('btnZimmedar').className = "px-4 py-2 bg-white text-indigo-700 font-bold rounded-md shadow transition";
            } else {
                document.getElementById('btnAsatiza').className = "px-4 py-2 bg-white text-indigo-700 font-bold rounded-md shadow transition";
            }
        }

        // --- ZIMMEDAR CREATE LOGIC ---
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "Creating..."; btn.disabled = true;

            const ustazName = document.getElementById('ustazName').value.trim();
            const jamiaName = document.getElementById('jamiaName').value.trim();
            const assignedClass = document.getElementById('assignedClass').value;
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const fakeEmail = username + "@telethon.com";

            try {
                const userCredential = await secondaryAuth.createUserWithEmailAndPassword(fakeEmail, password);
                await secondaryAuth.signOut();
                await db.collection('users').doc(userCredential.user.uid).set({
                    username: username, ustazName: ustazName, jamiaName: jamiaName,
                    assignedClass: assignedClass, role: "zimmedar",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ Zimmedar ka account successfully ban gaya!");
                document.getElementById('createUserForm').reset();
            } catch (error) { alert("❌ Error: " + error.message); } 
            finally { btn.innerHTML = "Account Banayein"; btn.disabled = false; }
        });

        // --- LOAD ZIMMEDARS ---
        db.collection('users').where("role", "==", "zimmedar").onSnapshot((snapshot) => {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = snapshot.empty ? '<tr><td colspan="4" class="p-4 text-center text-slate-500">Koi zimmedar add nahi hua abhi.</td></tr>' : "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id;
                tbody.innerHTML += `<tr class="border-b hover:bg-slate-50">
                    <td class="p-3 font-semibold text-indigo-600">${data.username}</td>
                    <td class="p-3">${data.ustazName}</td>
                    <td class="p-3">${data.jamiaName}</td>
                    <td class="p-3"><span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full text-xs font-bold">${data.assignedClass}</span></td>
                    
                </tr>`;
            });
        });

        // --- GOOGLE DRIVE LINK CONVERTER ---
        function getDirectImageUrl(url) {
            if (!url) return "";
            // Agar link Google Drive ka hai
            if (url.includes("drive.google.com/file/d/")) {
                let fileId = url.split("/d/")[1].split("/")[0];
                return `https://drive.google.com/uc?export=view&id=${fileId}`;
            }
            return url;
        }
        
       // --- LOAD ASATIZA DETAILS (WITH A-Z SORTING & FILTERING) ---
        let allAsatizaData = []; // Firebase ka saara data yahan store hoga
        let currentFilteredData = []; // Table me jo dikh raha hai wo yahan hoga
        let asatizaDataList = []; // Excel ke liye
        
        // Excel Data Yahan Save Hai
        const zimmedarList = {"AHMEDABAD": "Mahtab Misbahi", "BARODA": "Mahtab Misbahi", "BHAWNAGAR": "Mahtab Misbahi", "BHUJ": "Mahtab Misbahi", "BOMBAY HOTEL": "Mahtab Misbahi", "DHOLKA": "Mahtab Misbahi", "DHORAJI": "Mahtab Misbahi", "GADHADA": "Mahtab Misbahi", "JAMNAGAR": "Mahtab Misbahi", "JUHAPURA": "Mahtab Misbahi", "KAPADWANJ": "Mahtab Misbahi", "KOTHARA": "Mahtab Misbahi", "MANDVI": "Mahtab Misbahi", "NAKHATRANA": "Mahtab Misbahi", "RAJKOT": "Mahtab Misbahi", "SURAT": "Mahtab Misbahi", "UNN PATIYA SURAT": "Mahtab Misbahi", "VERAVAL": "Mahtab Misbahi", "VIRAMGAM": "Mahtab Misbahi", "BALAGHAT": "Akmal Kamal Madani", "BHOPAL": "Akmal Kamal Madani", "DEWAS": "Akmal Kamal Madani", "INDORE": "Akmal Kamal Madani", "JABALPUR": "Akmal Kamal Madani", "JABALPUR BYPASS": "Akmal Kamal Madani", "KATNI": "Akmal Kamal Madani", "MANDSAUR": "Akmal Kamal Madani", "LUDHIANA": "Junaid Madani", "BADMER": "Junaid Madani", "BANDHEWA": "Junaid Madani", "BHILWADA": "Junaid Madani", "BIKANER": "Junaid Madani", "DAMOLAI": "Junaid Madani", "FATAHPUR": "Junaid Madani", "JAIPUR": "Junaid Madani", "JODHPUR": "Junaid Madani", "KOTA CITY": "Junaid Madani", "KOTA STATION": "Junaid Madani", "KUCHAMAN": "Said Madani", "KUCHEEL": "Said Madani", "MAKRANA": "Said Madani", "NAGAUR": "Said Madani", "NIMBAHERA": "Said Madani", "PALI": "Said Madani", "RAJNAGAR": "Said Madani", "SHERANIABAD": "Said Madani", "UDAIPUR": "Said Madani", "ANNIGERI": "Sohail Madani", "BANGALORE": "Sohail Madani", "BELGAUM": "Sohail Madani", "DHARWAD": "Sohail Madani", "MYSORE": "Sohail Madani", "SIRSI": "Sohail Madani", "TABIB LAND HUBLI": "Sohail Madani", "ARRAH": "Azad Misbahi", "AURANGABAD": "Azad Misbahi", "BHAGALPUR": "Azad Misbahi", "PATNA": "Azad Misbahi", "PURNIA": "Azad Misbahi", "SALMARI": "Azad Misbahi", "SIWAN CITY": "Azad Misbahi", "SASARAM": "Azad Misbahi", "BADGAM": "Nisar Madani", "JAMMU": "Nisar Madani", "KULGAM": "Nisar Madani", "MONGHAMA": "Nisar Madani", "PUNCHH": "Nisar Madani", "RAJORI": "Nisar Madani", "RIYASI": "Nisar Madani", "SANGAM": "Nisar Madani", "SOPORE": "Nisar Madani", "UCCHAD": "Nisar Madani", "ALLAHABAD": "Dilkash Madani", "BANARAS": "Dilkash Madani", "COLONELGANJ": "Dilkash Madani", "FAIZABAD": "Dilkash Madani", "FARRUKHABAD": "Dilkash Madani", "GOPIGANJ": "Dilkash Madani", "GORAKHPUR": "Dilkash Madani", "JAGDISHPUR": "Dilkash Madani", "JONPUR": "Dilkash Madani", "MIRZAPUR": "Dilkash Madani", "NANPARA": "Dilkash Madani", "JHANSI": "Nasim Misbahi", "KANPUR": "Nasim Misbahi", "LUCKNOW": "Nasim Misbahi", "MAHOBA": "Nasim Misbahi", "PADAW": "Nasim Misbahi", "TANDA": "Nasim Misbahi", "UNNAO": "Nasim Misbahi", "UTRAULA": "Nasim Misbahi", "AGRA": "Nasim Misbahi", "SHAHJAHANPUR": "Nasim Misbahi", "ALIGARH": "Owais Madani", "BAREILLY SHARIF": "Owais Madani", "BILARI": "Owais Madani", "DELHI": "Owais Madani", "GAZIYABAD": "Owais Madani", "MAHUAKHEDA": "Owais Madani", "RAMPUR": "Owais Madani", "SHISHGADH": "Owais Madani", "THAKURDWARA": "Owais Madani", "TIGRI DEOBAND": "Owais Madani", "HALDWANI": "Owais Madani", "ADONI": "Abu Sufiyan Misbahi", "MACHILIPATNAM": "Abu Sufiyan Misbahi", "BALLARI": "Abu Sufiyan Misbahi", "GULBARGA SHARIF": "Abu Sufiyan Misbahi", "CHENNAI": "Abu Sufiyan Misbahi", "FALAKNUMA": "Abu Sufiyan Misbahi", "HYDERABAD": "Abu Sufiyan Misbahi", "JANGAON": "Abu Sufiyan Misbahi", "MANGALDOI ASSAM": "Shabbir Madani", "SILCHAR": "Shabbir Madani", "DHANBAD": "Shabbir Madani", "JAMSHEDPUR": "Shabbir Madani", "RANCHI": "Shabbir Madani", "RANCHI ILAHI NAGAR": "Shabbir Madani", "BHADRAK": "Shabbir Madani", "SORO": "Shabbir Madani", "ASANSOL": "Shabbir Madani", "KHIDIRPUR": "Shabbir Madani", "METIABRUZ": "Shabbir Madani", "BILASPUR": "Sarfaraz Madani", "RAIPUR": "Sarfaraz Madani", "AHMEDNAGAR": "Sarfaraz Madani", "AKOLA": "Sarfaraz Madani", "BHANDARA": "Sarfaraz Madani", "BHANDUP": "Sarfaraz Madani", "JALGAON": "Sarfaraz Madani", "KALYAN": "Sarfaraz Madani", "KAMPTEE": "Sarfaraz Madani", "KARANJA": "Sarfaraz Madani", "RAVER": "Sarfaraz Madani", "KARBALA MASJID GOVANDI": "Irfan Misbahi", "KHULDABAD": "Irfan Misbahi", "KORADI": "Irfan Misbahi", "LATUR": "Irfan Misbahi", "MAHIM": "Irfan Misbahi", "MALEGAON": "Irfan Misbahi", "MITTI MASJID GOVANDI": "Irfan Misbahi", "MODEL JAMIA": "Irfan Misbahi", "MUMBAI": "Irfan Misbahi", "NAGPUR": "Irfan Misbahi", "PUNE": "Irfan Misbahi", "SHAHADA": "Irfan Misbahi"};

        // Firebase Se Data Nikaal Kar Array Me Daalna
        db.collection('asatiza_details').orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
            allAsatizaData = []; 
            snapshot.forEach((doc) => {
                const data = doc.data();
                data.docId = doc.id;
                data.jamiaName = data.jamiaName || "N/A";
                data.zimmedarName = zimmedarList[data.jamiaName] || "N/A";
                allAsatizaData.push(data);
            });
            renderTableAndFilter(); // Har baar naya data aane par table render hogi
        });

       // --- FILTER, SORT & RENDER LOGIC ---
        function renderTableAndFilter() {
            const tbody = document.getElementById('asatizaTableBody');
            const searchInput = document.getElementById("searchInput").value.toLowerCase();
            
            // 1. Data Filter Karna
            currentFilteredData = allAsatizaData.filter(data => {
                const searchString = `${data.ustazName} ${data.jamiaName} ${data.zimmedarName} ${data.region} ${data.state}`.toLowerCase();
                return searchString.includes(searchInput);
            });

            // 2. Data Sort Karna (Jamia Name A to Z)
            currentFilteredData.sort((a, b) => a.jamiaName.localeCompare(b.jamiaName));

            // 3. HTML Table Generate Karna (Speed Optimize Kiya Hua)
            asatizaDataList = [];
            if (currentFilteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-center text-slate-500">Koi record nahi mila.</td></tr>';
                return;
            }

            // FAST RENDERING: Yahan ek variable banaya hai taaki browser hang na ho
            let tableHTML = ""; 

            currentFilteredData.forEach(data => {
                const dateObj = data.timestamp ? data.timestamp.toDate() : new Date();
                const dateStr = dateObj.toLocaleDateString('en-IN');
                
                const directUrl = getDirectImageUrl(data.photoUrl);
                const photoHtml = data.photoUrl 
                    ? `<img src="${directUrl}" referrerpolicy="no-referrer" onclick="openModal('${directUrl}')" class="w-10 h-10 rounded-full object-cover border border-slate-200 cursor-pointer hover:ring-2 ring-indigo-300 transition" alt="Photo">`
                    : `<div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 text-xs">No Pic</div>`;

                asatizaDataList.push({
                    "Ustaz Name": data.ustazName || "N/A",
                    "Jamia Name": data.jamiaName,
                    "Zimmedar Name": data.zimmedarName,
                    "Region": data.region || "N/A",
                    "State": data.state || "N/A",
                    "Mobile No": data.mobileNo || "N/A",
                    "Class (Darja)": data.className || "N/A",
                    "Photo Link": directUrl || "N/A",
                    "Submission Date": dateStr
                });

                // tableHTML me pehle saara data jama karenge
                tableHTML += `<tr class="border-b hover:bg-slate-50 search-row">
                    <td class="p-2">${photoHtml}</td>
                    <td class="p-3 font-semibold text-slate-800">${data.ustazName || "N/A"}</td>
                    <td class="p-3 font-bold text-indigo-700">${data.jamiaName}</td>
                    <td class="p-3 text-sm font-bold text-slate-700 bg-slate-100 rounded-lg">${data.zimmedarName}</td>
                    <td class="p-3">
                        <div class="text-sm font-semibold">${data.region || "N/A"}</div>
                        <div class="text-xs text-slate-500">${data.state || "N/A"}</div>
                    </td>
                    <td class="p-3 font-semibold text-emerald-600">${data.mobileNo || "N/A"}</td>
                    <td class="p-3"><span class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full text-xs font-bold">${data.className || "N/A"}</span></td>
                    <td class="p-3 text-xs text-slate-500">${dateStr}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteEntry('${data.docId}')" class="text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 p-2 rounded-lg transition" title="Entry Delete Karein">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                </tr>`;
            });
            
            // Aakhir me ek hi baar poori table update hogi, jis se hang nahi hoga
            tbody.innerHTML = tableHTML; 
        }

        // --- SMART SEARCH (Debounce) LOGIC ---
        let searchTimeout;
        function filterTable() {
            clearTimeout(searchTimeout);
            // Jab tak aap type kar rahe honge ye ruke ga, type rokne ke 300 millisecond baad filter chalega
            searchTimeout = setTimeout(() => {
                renderTableAndFilter();
            }, 300); 
        }

        // Jab user search me kuch likhega to ye function call hoga
        function filterTable() {
            renderTableAndFilter();
        }

      // --- TABLE KI IMAGE (SCREENSHOT) DOWNLOAD KARNE KA LOGIC ---
        function downloadTableAsImage(event) {
            const tableElement = document.getElementById('asatizaMainTable');
            const btn = event.currentTarget;
            const btnText = btn.querySelector('span');
            const originalText = btnText.innerText;
            
            // Loading state
            btnText.innerText = "Processing...";
            btn.classList.add("opacity-70", "cursor-wait");

            // HTML ko Canvas (Image) me convert karna
            html2canvas(tableElement, {
                scale: 2, // HD Quality ke liye 2x scale
                backgroundColor: "#ffffff", // Background transparent na rahe
                useCORS: true // Table ke andar ki profile photos ko allow karne ke liye
            }).then(canvas => {
                const searchVal = document.getElementById("searchInput").value.trim();
                const fileName = searchVal ? `Telethon_List_${searchVal}.png` : 'Telethon_List_All.png';
                
                // Image download karwana
                const link = document.createElement('a');
                link.download = fileName;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Button wapas normal karna
                btnText.innerText = originalText;
                btn.classList.remove("opacity-70", "cursor-wait");
            }).catch(error => {
                console.error("Image export failed:", error);
                alert("Image generate karne mein kuch masla aaya.");
                btnText.innerText = originalText;
                btn.classList.remove("opacity-70", "cursor-wait");
            });
        }

        // --- EXPORT TO EXCEL LOGIC (SheetJS) ---
        function exportToExcel() {
            if (asatizaDataList.length === 0) {
                alert("Koi data mojood nahi hai export karne ke liye.");
                return;
            }
            // Array of Objects ko Excel sheet me convert karna
            const worksheet = XLSX.utils.json_to_sheet(asatizaDataList);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Asatiza Details");
            
            // File download karwana
            XLSX.writeFile(workbook, "Asatiza_Telethon_2026.xlsx");
        }

        // --- IMAGE MODAL LOGIC (Photo Badi Karne Ke Liye) ---
        function openModal(imgSrc) {
            document.getElementById('modalImage').src = imgSrc;
            document.getElementById('imageModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalImage').src = "";
        }
        // --- ENTRY DELETE LOGIC ---
async function deleteEntry(docId) {
    let confirmDelete = confirm("Kya aap waqai is entry ko delete karna chahte hain? Yeh hamesha ke liye delete ho jayegi.");
    if (confirmDelete) {
        try {
            await db.collection('asatiza_details').doc(docId).delete();
        } catch (error) {
            alert("Delete karne mein error aaya: " + error.message);
        }
    }
}
    </script>
