<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asatiza Detail Form - Telethon 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="p-4 flex justify-center items-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-200">
        <div class="text-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-indigo-700">Asatiza Registration Form</h1>
            <p class="text-slate-500 text-sm mt-1">Telethon 2025 ke liye apni detail darj karein</p>
        </div>

        <form id="asatizaForm" class="space-y-4">
            
            <!-- SMART CONNECTED DROPDOWNS -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Region</label>
                    <select id="regionSelect" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 bg-indigo-50 font-semibold text-indigo-800">
                        <option value="">Select Region...</option>
                        <!-- Regions Javascript se aayenge -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">State</label>
                    <select id="stateSelect" required disabled class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 bg-slate-50 disabled:opacity-50">
                        <option value="">Pehle Region chunein</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Jamia / Madarsa Ka Naam</label>
                <select id="jamiaName" required disabled class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white font-bold text-slate-800 disabled:opacity-50">
                    <option value="">Pehle State chunein...</option>
                </select>
            </div>

            <!-- BAAKI KA FORM -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Aapka Naam (Muallim / Teacher)</label>
                <input type="text" id="ustazName" required placeholder="Apna pura naam likhein" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Mobile / WhatsApp No.</label>
                <input type="number" id="mobileNo" required placeholder="Jaise: 9876543210" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Aap Kis Darje Ke Muallim Hain?</label>
                <select id="className" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="">Class Select Karein...</option>
                    <option value="Ibtidaiya">Ibtidaiya</option>
                    <option value="Sale Awwal">Sale Awwal</option>
                    <option value="Sale Duwam">Sale Duwam</option>
                    <option value="Ula">Ula</option>
                    <option value="Saniya">Saniya</option>
                    <option value="Salisa">Salisa</option>
                    <option value="Rabia">Rabia</option>
                    <option value="Khamisa">Khamisa</option>
                    <option value="Sadisa">Sadisa</option>
                    <option value="Sabia">Sabia</option>
                    <option value="Doratul Hadis">Doratul Hadis</option>
                </select>
            </div>
            
            <div class="p-3 bg-indigo-50 border border-indigo-100 rounded-lg mt-2">
                <label class="block text-sm font-semibold text-indigo-700 mb-1">Aapki Tasveer (Photo)</label>
                <input type="file" id="teacherPhoto" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 transition">
                <p class="text-xs text-slate-500 mt-1">Photo dena zaroori nahi hai, par denge to winner poster par aayegi.</p>
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition mt-4 shadow-md">
                Detail Jama Karein
            </button>
        </form>

        <div id="successMsg" class="hidden mt-4 p-4 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-lg text-center font-bold">
            Jazakallah! Aapki detail successfully jama ho gayi hai.
        </div>
    </div>

    <script>
        // ========================================================
        // 1. EXCEL DATA (JSON FORMAT ME)
        // ========================================================
        const jamiaData = {"Ajmer": {"GUJRAT": ["AHMEDABAD", "BARODA", "BHAWNAGAR", "BHUJ", "BOMBAY HOTEL", "DHOLKA", "DHORAJI", "GADHADA", "JAMNAGAR", "JUHAPURA", "KAPADWANJ", "KOTHARA", "MANDVI", "NAKHATRANA", "RAJKOT", "SURAT", "UNN PATIYA SURAT", "VERAVAL", "VIRAMGAM"], "M.P.": ["BALAGHAT", "BHOPAL", "DEWAS", "INDORE", "JABALPUR", "JABALPUR BYPASS", "KATNI", "MANDSAUR"], "PUNJAB": ["LUDHIANA"], "RAJASTHAN": ["BADMER", "BANDHEWA", "BHILWADA", "BIKANER", "DAMOLAI", "FATAHPUR", "JAIPUR", "JODHPUR", "KOTA CITY", "KOTA STATION", "KUCHAMAN", "KUCHEEL", "MAKRANA", "NAGAUR", "NIMBAHERA", "PALI", "RAJNAGAR", "SHERANIABAD", "UDAIPUR"]}, "Bangalore": {"KARNATAKA": ["ANNIGERI", "BANGALORE", "BELGAUM", "DHARWAD", "MYSORE", "SIRSI", "TABIB LAND HUBLI"]}, "Delhi": {"BIHAR": ["ARRAH", "AURANGABAD", "BHAGALPUR", "PATNA", "PURNIA", "SALMARI", "SIWAN CITY"], "J&K": ["BADGAM", "JAMMU", "KULGAM", "MONGHAMA", "PUNCHH", "RAJORI", "RIYASI", "SANGAM", "SASARAM", "SOPORE", "UCCHAD"], "U.P. EAST": ["ALLAHABAD", "BANARAS", "COLONELGANJ", "FAIZABAD", "FARRUKHABAD", "GOPIGANJ", "GORAKHPUR", "JAGDISHPUR", "JHANSI", "JONPUR", "KANPUR", "LUCKNOW", "MAHOBA", "MIRZAPUR", "NANPARA", "PADAW", "TANDA", "UNNAO", "UTRAULA"], "U.P. WEST": ["AGRA", "ALIGARH", "BAREILLY SHARIF", "BILARI", "DELHI", "GAZIYABAD", "MAHUAKHEDA", "RAMPUR", "SHAHJAHANPUR", "SHISHGADH", "THAKURDWARA", "TIGRI DEOBAND"], "UTTARAKHAND": ["HALDWANI"]}, "Hyderabad": {"ANDHRA PRADESH": ["ADONI", "MACHILIPATNAM"], "KARNATAKA": ["BALLARI", "GULBARGA SHARIF"], "TAMIL NADU": ["CHENNAI"], "TELANGANA": ["FALAKNUMA", "HYDERABAD", "JANGAON"]}, "Kolkata": {"ASSAM": ["MANGALDOI ASSAM", "SILCHAR"], "JHARKHAND": ["DHANBAD", "JAMSHEDPUR", "RANCHI", "RANCHI ILAHI NAGAR"], "ODISHA": ["BHADRAK", "SORO"], "WEST BENGAL": ["ASANSOL", "KHIDIRPUR", "METIABRUZ"]}, "Mumbai": {"CHHATTISGADH": ["BILASPUR", "RAIPUR"], "MAHARASHTRA": ["AHMEDNAGAR", "AKOLA", "BHANDARA", "BHANDUP", "JALGAON", "KALYAN", "KAMPTEE", "KARANJA", "KARBALA MASJID GOVANDI", "KHULDABAD", "KORADI", "LATUR", "MAHIM", "MALEGAON", "MITTI MASJID GOVANDI", "MODEL JAMIA", "MUMBAI", "NAGPUR", "PUNE", "RAVER", "SHAHADA"]}};

        // ========================================================
        // 2. CONNECTED DROPDOWN LOGIC
        // ========================================================
        const regionSelect = document.getElementById('regionSelect');
        const stateSelect = document.getElementById('stateSelect');
        const jamiaSelect = document.getElementById('jamiaName');

        // Regions load karna
        for (let region in jamiaData) {
            regionSelect.add(new Option(region, region));
        }

        // Jab Region change ho to State load karo
        regionSelect.addEventListener('change', function() {
            stateSelect.innerHTML = '<option value="">Select State...</option>';
            jamiaSelect.innerHTML = '<option value="">Pehle State chunein...</option>';
            jamiaSelect.disabled = true;
            
            if (this.value) {
                stateSelect.disabled = false;
                stateSelect.classList.remove('bg-slate-50');
                stateSelect.classList.add('bg-white');
                for (let state in jamiaData[this.value]) {
                    stateSelect.add(new Option(state, state));
                }
            } else {
                stateSelect.disabled = true;
                stateSelect.classList.add('bg-slate-50');
            }
        });

        // Jab State change ho to Jamia load karo
        stateSelect.addEventListener('change', function() {
            jamiaSelect.innerHTML = '<option value="">Select Jamia...</option>';
            
            if (this.value) {
                jamiaSelect.disabled = false;
                jamiaSelect.classList.remove('bg-slate-50');
                jamiaSelect.classList.add('bg-indigo-50');
                
                let selectedRegion = regionSelect.value;
                let jamiasList = jamiaData[selectedRegion][this.value];
                
                jamiasList.forEach(jamia => {
                    jamiaSelect.add(new Option(jamia, jamia));
                });
            } else {
                jamiaSelect.disabled = true;
                jamiaSelect.classList.add('bg-slate-50');
            }
        });

         // ========================================================
        // 🛑 APNA FIREBASE CONFIG YAHAN PASTE KAREIN 🛑
        // ========================================================
         const firebaseConfig = {
  apiKey: "AIzaSyC87_ca7MsGB2WjOnr6dC-IYL78TYx0Oyg",
  authDomain: "telethon-28c88.firebaseapp.com",
  projectId: "telethon-28c88",
  storageBucket: "telethon-28c88.firebasestorage.app",
  messagingSenderId: "609452116316",
  appId: "1:609452116316:web:e940fc5dc4537b34551999",
  measurementId: "G-FYS0PJLQQB"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 🛑 APNA NAYA GOOGLE APPS SCRIPT WEB APP URL YAHAN DALEIN 🛑
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8BAtfZMnD66LO2YI11__BjdwBJF0ZKf3XPpCbAuTgUihQNbTCJycKTLuGpEcSVJRHRw/exec";

        // ========================================================
        // 4. FORM SUBMIT LOGIC
        // ========================================================
        document.getElementById('asatizaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "Form Submit Ho Raha Hai..."; btn.disabled = true;

            try {
                let photoUrl = "";
                const photoInput = document.getElementById('teacherPhoto').files[0];

                if (photoInput) {
                    btn.innerHTML = "Photo Drive me upload ho rahi hai (Isme 10-15 second lag sakte hain)...";
                    
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]);
                        reader.onerror = error => reject(error);
                        reader.readAsDataURL(photoInput);
                    });

                    const payload = {
                        name: Date.now() + "_" + photoInput.name,
                        mimeType: photoInput.type,
                        base64: base64Data
                    };

                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === "success") {
                        photoUrl = result.url;
                    } else {
                        throw new Error("Photo upload fail: " + result.message);
                    }
                }

                btn.innerHTML = "Detail Data Save ho raha hai...";

                // Firestore Database me save karein (Naye Region aur State ke sath)
                await db.collection('asatiza_details').add({
                    region: document.getElementById('regionSelect').value,
                    state: document.getElementById('stateSelect').value,
                    jamiaName: document.getElementById('jamiaName').value,
                    ustazName: document.getElementById('ustazName').value.trim(),
                    mobileNo: document.getElementById('mobileNo').value.trim(),
                    className: document.getElementById('className').value,
                    photoUrl: photoUrl, 
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('asatizaForm').classList.add('hidden');
                document.getElementById('successMsg').classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert("Error: " + error.message);
                btn.innerHTML = "Detail Jama Karein"; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
