<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimmedar Panel - Telethon 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 sm:p-6 min-h-screen">

    <div class="max-w-3xl mx-auto">
        
        <!-- ========================================== -->
        <!-- 1. LOGIN SECTION -->
        <!-- ========================================== -->
        <div id="loginSection" class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 mt-10 max-w-md mx-auto">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-indigo-600 mb-2">Zimmedar Login</h1>
                <p class="text-slate-500 text-sm">Apni assigned class ka data manage karein</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <input type="text" id="loginUsername" required placeholder="Jaise: admin_ula" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 bg-slate-50 outline-none transition">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition shadow-lg mt-4">
                    Login Karein
                </button>
            </form>
        </div>

        <!-- ========================================== -->
        <!-- 2. MAIN DASHBOARD SECTION -->
        <!-- ========================================== -->
        <div id="dashboardSection" class="hidden">
            
            <!-- Header -->
            <header class="bg-indigo-600 text-white p-5 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div>
                    <h1 class="text-2xl font-bold" id="displayZimmedarName">Zimmedar Name</h1>
                    <p class="text-indigo-200 font-semibold text-sm">Assigned Class: <span id="displayClass" class="text-white font-bold px-2 py-1 bg-indigo-700 rounded-md">Class</span></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('addJamiaModal').classList.remove('hidden')" class="bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-emerald-400 shadow-md transition">
                        + Naya Jamia Add Karein
                    </button>
                    <button id="logoutBtn" class="bg-indigo-800 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-rose-500 transition">Logout</button>
                </div>
            </header>

            <!-- Search Bar -->
            <div class="mb-6 relative">
                <input type="text" id="searchInput" placeholder="Jamia ya Teacher ka naam search karein..." class="w-full pl-4 pr-4 py-4 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-0 outline-none transition text-lg font-semibold text-slate-700 shadow-sm">
            </div>

            <!-- Jamias List -->
            <div id="jamiaList" class="space-y-4">
                <div class="text-center p-10 text-slate-500 font-semibold animate-pulse">Data load ho raha hai...</div>
            </div>
            
        </div>

        <!-- ========================================== -->
        <!-- 3. ADD NEW JAMIA MODAL -->
        <!-- ========================================== -->
        <div id="addJamiaModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-50">
            <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Naya Jamia Add Karein</h2>
                    <button onclick="document.getElementById('addJamiaModal').classList.add('hidden')" class="text-slate-400 hover:text-rose-500 font-bold text-xl">&times;</button>
                </div>
                <form id="addJamiaForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Jamia Name</label>
                        <input type="text" id="newJamiaName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Teacher / Ustaz Name</label>
                        <input type="text" id="newTeacherName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Contact No. (Mobile)</label>
                        <input type="text" id="newContactNo" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Region / Shahar</label>
                        <input type="text" id="newRegion" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button type="submit" id="saveJamiaBtn" class="w-full bg-emerald-500 text-white font-bold py-2 rounded-lg hover:bg-emerald-600 transition">Save Jamia</button>
                </form>
            </div>
        </div>

    </div>

    <script>
        // ========================================================
        // 🛑 APNA FIREBASE CONFIG YAHAN PASTE KAREIN 🛑
        // ========================================================
        const firebaseConfig = {
            apiKey: "AAPKI_API_KEY",
            authDomain: "AAPKA_PROJECT.firebaseapp.com",
            projectId: "AAPKA_PROJECT_ID",
            storageBucket: "AAPKA_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentZimmedar = null;

        // ========================================================
        // 1. LOGIN LOGIC
        // ========================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = "Logging in..."; btn.disabled = true;

            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const fakeEmail = username + "@telethon.com";

            try {
                await auth.signInWithEmailAndPassword(fakeEmail, password);
            } catch (error) {
                alert("❌ Login Fail: Username ya Password galat hai.");
                btn.innerHTML = "Login Karein"; btn.disabled = false;
            }
        });

        // ========================================================
        // 2. CHECK LOGIN & LOAD JAMIAS
        // ========================================================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    currentZimmedar = doc.data();
                    
                    document.getElementById('displayZimmedarName').innerText = currentZimmedar.ustazName + " (Zimmedar)";
                    document.getElementById('displayClass').innerText = currentZimmedar.assignedClass;

                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('dashboardSection').classList.remove('hidden');

                    // Ussi class ke Jamias load karein
                    loadJamias(currentZimmedar.assignedClass);
                } else {
                    auth.signOut();
                }
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('dashboardSection').classList.add('hidden');
                document.getElementById('loginBtn').innerHTML = "Login Karein";
                document.getElementById('loginBtn').disabled = false;
            }
        });

        // ========================================================
        // 3. LOAD JAMIAS & SEARCH LOGIC
        // ========================================================
        function loadJamias(assignedClass) {
            db.collection('jamias').where("className", "==", assignedClass).onSnapshot((snapshot) => {
                const listDiv = document.getElementById('jamiaList');
                listDiv.innerHTML = "";

                if (snapshot.empty) {
                    listDiv.innerHTML = '<div class="text-center p-6 bg-white rounded-xl shadow-sm border">Abhi tak is class me koi Jamia add nahi kiya gaya hai. Upar button daba kar add karein.</div>';
                    return;
                }

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const jamiaId = doc.id;
                    const totalSoFar = data.totalAmount || 0;

                    // Jamia Card HTML
                    const card = document.createElement('div');
                    card.className = "jamia-card bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 transition hover:shadow-md";
                    
                    // Search filtering ke liye custom attribute banaya
                    card.setAttribute('data-search', `${data.jamiaName.toLowerCase()} ${data.ustazName.toLowerCase()}`);

                    card.innerHTML = `
                        <div class="w-full md:w-2/3">
                            <h3 class="text-xl font-bold text-slate-800">${data.jamiaName}</h3>
                            <div class="text-sm text-slate-500 mt-1 flex flex-wrap gap-x-4">
                                <span><span class="font-semibold text-slate-700">Teacher:</span> ${data.ustazName}</span>
                                <span><span class="font-semibold text-slate-700">Mobile:</span> ${data.contactNo || '-'}</span>
                            </div>
                            <div class="mt-2 text-indigo-600 font-bold">Total jama raqam: ₹ ${totalSoFar.toLocaleString()}</div>
                        </div>
                        
                        <div class="w-full md:w-1/3 flex gap-2">
                            <input type="number" id="amt_${jamiaId}" placeholder="Aaj ki raqam..." class="w-full px-3 py-2 border-2 border-indigo-200 rounded-lg focus:border-indigo-500 outline-none font-bold text-slate-700">
                            <button onclick="submitEntry('${jamiaId}', '${data.jamiaName}')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700 transition shrink-0">
                                Add
                            </button>
                        </div>
                    `;
                    listDiv.appendChild(card);
                });
            });
        }

        // Live Search Filter
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.jamia-card');
            
            cards.forEach(card => {
                const text = card.getAttribute('data-search');
                if (text.includes(searchTerm)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });

        // ========================================================
        // 4. ADD NEW JAMIA (Zimmedar khud add kar sakta hai)
        // ========================================================
        document.getElementById('addJamiaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveJamiaBtn');
            btn.innerHTML = "Saving..."; btn.disabled = true;

            try {
                await db.collection('jamias').add({
                    jamiaName: document.getElementById('newJamiaName').value.trim(),
                    ustazName: document.getElementById('newTeacherName').value.trim(),
                    contactNo: document.getElementById('newContactNo').value.trim(),
                    region: document.getElementById('newRegion').value.trim(),
                    className: currentZimmedar.assignedClass, // Auto assign wahi class
                    totalAmount: 0, // Shuru me 0
                    addedBy: auth.currentUser.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('addJamiaForm').reset();
                document.getElementById('addJamiaModal').classList.add('hidden');
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.innerHTML = "Save Jamia"; btn.disabled = false;
            }
        });

        // ========================================================
        // 5. SUBMIT AMOUNT (Zimmedar kisi ki entry karta hai)
        // ========================================================
        window.submitEntry = async function(jamiaId, jamiaName) {
            const inputField = document.getElementById(`amt_${jamiaId}`);
            const amount = parseFloat(inputField.value);

            if (!amount || amount <= 0) {
                alert("Sahi raqam darj karein!");
                return;
            }

            if (!confirm(`${jamiaName} ke liye ₹${amount} jama kar dein?`)) return;

            try {
                // 1. Database me Total Amount badhao (Live dashboard ke liye)
                await db.collection('jamias').doc(jamiaId).update({
                    totalAmount: firebase.firestore.FieldValue.increment(amount)
                });

                // 2. History record save karo
                await db.collection('entries').add({
                    jamiaId: jamiaId,
                    jamiaName: jamiaName,
                    amount: amount,
                    zimmedarUid: auth.currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                inputField.value = ""; // Input khali karo
                // Success sound ya alert
                alert(`✅ ${jamiaName} ki entry jama ho gayi!`);

            } catch (error) {
                console.error("Entry fail:", error);
                alert("Entry save nahi hui, internet check karein.");
            }
        };

        // ========================================================
        // 6. LOGOUT
        // ========================================================
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
        });
    </script>
</body>
</html>
